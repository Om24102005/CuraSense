<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>CuraSense | AI HEALTH ANALYSER Diagnostics</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' blob: https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*;">
  <script>
    // No-flash theme bootstrap: runs before first paint, before React mounts.
    // Keep this in sync with the dark/light `vars` in src/app/themes.ts —
    // only the handful of paint-critical ones are duplicated here.
    (function () {
      try {
        var saved = localStorage.getItem('curasense_theme');
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var vars = theme === 'light' ? {
          '--bg-base': '#eaf0f9', '--text-primary': '#0a1230',
          '--bg-surface': 'rgba(255,255,255,0.8)', '--bg-card': 'rgba(255,255,255,0.86)',
          '--text-secondary': 'rgba(10,18,48,0.78)', '--text-muted': 'rgba(10,18,48,0.56)',
          '--border-color': 'rgba(10,36,114,0.14)', '--header-bg': 'rgba(234,240,249,0.88)'
        } : {
          '--bg-base': '#05070f', '--text-primary': '#dceaf4',
          '--bg-surface': 'rgba(8,12,26,0.66)', '--bg-card': 'rgba(10,16,34,0.72)',
          '--text-secondary': 'rgba(220,234,244,0.74)', '--text-muted': 'rgba(220,234,244,0.48)',
          '--border-color': 'rgba(135,191,255,0.14)', '--header-bg': 'rgba(5,7,15,0.78)'
        };
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        for (var k in vars) root.style.setProperty(k, vars[k]);
      } catch (e) { /* localStorage/matchMedia unavailable — default dark CSS stays */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
